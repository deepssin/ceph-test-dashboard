[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ceph-test-dashboard"
version = "0.1.0"
description = "Ceph Teuthology test dashboard"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11.0",
    "pandas>=2.3.3",
    "plotly>=6.9.0",
    "requests>=2.32.5",
    "streamlit>=1.54.0",
]

[project.scripts]
ceph-test-dashboard-alerts = "libs.mail_reports:main"

[tool.hatch.build.targets.wheel]
packages = ["libs"]

[tool.hatch.build.targets.wheel.force-include]
"templates/reports" = "templates/reports"

[tool.uv]
package = true
