---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ceph-test-dashboard-config
  namespace: ${DASHBOARD_NAMESPACE}
  labels:
    app.kubernetes.io/name: ceph-test-dashboard
    app.kubernetes.io/component: config
data:
  ceph-test-dashboard.ini: |
    [paddles]
    base_url = ${PADDLES_BASE_URL}

    [pulpito]
    base_url = ${PULPITO_BASE_URL}

    [nightly]
    run_user = ${NIGHTLY_RUN_USER}

    [cache]
    refresh_minutes = 60

    [release]
    branches = main, umbrella, tentacle, squid

    [storage]
    data_dir = /var/lib/ceph-test-dashboard

    [hardware]
    min_runs = 2

    [alerts]
    enabled = true
    recipients = ${ALERTS_RECIPIENTS}
    smtp_host = relay.front.sepia.ceph.com
    smtp_port = 25
    from_addr = ceph-nightly@sepia.ceph.com
    daily_lookback_days = 1
    weekly_fetch_days = 21
    daily_fetch_days = 5
    smoke_suite_match = smoke
    sqlite_path = mail-state.sqlite
    dashboard_base_url = https://${DASHBOARD_ROUTE_HOST}
